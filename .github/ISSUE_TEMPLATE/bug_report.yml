name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Bugs get fixed, best effort and without guaranteed response times.
        Please leave out real addresses, passwords and mail contents; use example.com names instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The UwUMail Server version it runs on, shown on the admin portal's overview.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser
      placeholder: Firefox 145 / Safari 26 / Chrome 142
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines only, with addresses and tokens removed.
      render: text
